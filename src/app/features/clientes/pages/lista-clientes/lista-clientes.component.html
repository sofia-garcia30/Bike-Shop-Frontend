<div class="p-6">
  <h1 class="text-2xl font-bold mb-4">Clientes</h1>

  <!-- Filtro -->
  <div class="mb-4">
    <input
      type="text"
      [(ngModel)]="filtroDocumento"
      (input)="aplicarFiltro()"
      placeholder="Buscar por documento..."
      class="w-full md:w-1/3 border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
    />
  </div>

  <!-- Cargando -->
  <div *ngIf="cargando" class="flex justify-center py-8">
    <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600"></div>
  </div>

  <!-- Error -->
  <div *ngIf="error" class="bg-red-100 text-red-700 p-3 rounded">
    {{ error }}
  </div>

  <!-- Tabla -->
  <div *ngIf="!cargando && !error" class="overflow-x-auto">
    <table class="min-w-full bg-white border border-gray-200 rounded-lg">
      <thead class="bg-gray-100">
      <tr>
        <th class="px-4 py-2 text-left">Documento</th>
        <th class="px-4 py-2 text-left">Nombre</th>
        <th class="px-4 py-2 text-left">Teléfono</th>
        <th class="px-4 py-2 text-left">Email</th>
        <th class="px-4 py-2 text-left">Dirección</th>
      </tr>
      </thead>
      <tbody>
      <tr *ngFor="let cliente of clientesFiltrados" class="border-t">
        <td class="px-4 py-2">{{ cliente.documento }}</td>
        <td class="px-4 py-2">{{ cliente.nombre }}</td>
        <td class="px-4 py-2">{{ cliente.telefono || '-' }}</td>
        <td class="px-4 py-2">{{ cliente.email || '-' }}</td>
        <td class="px-4 py-2">{{ cliente.direccion || '-' }}</td>
      </tr>
      <tr *ngIf="clientesFiltrados.length === 0">
        <td colspan="5" class="text-center py-4 text-gray-500">No hay clientes registrados</td>
      </tr>
      </tbody>
    </table>
  </div>
</div>
