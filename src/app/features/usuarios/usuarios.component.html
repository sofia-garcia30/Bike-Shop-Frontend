<div class="usuarios-container">
  <div class="header">
    <h1>Gestión de Usuarios</h1>
    <button class="btn-primary" (click)="abrirFormulario()">+ Nuevo Usuario</button>
  </div>

  <!-- Modal de formulario -->
  <div *ngIf="mostrarFormulario" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>{{ usuarioEditando ? 'Editar Usuario' : 'Nuevo Usuario' }}</h2>
        <button class="close-btn" (click)="cancelarFormulario()">×</button>
      </div>
      
      <div class="modal-body">
        <div class="form-group">
          <label>Nombre *</label>
          <input type="text" [(ngModel)]="nuevoUsuario.nombre" class="form-control" />
        </div>

        <div class="form-group">
          <label>Email *</label>
          <input type="email" [(ngModel)]="nuevoUsuario.email" class="form-control" />
        </div>

        <div class="form-group">
          <label>{{ usuarioEditando ? 'Nueva Contraseña (dejar vacío para no cambiar)' : 'Contraseña *' }}</label>
          <input type="password" [(ngModel)]="nuevoUsuario.password" class="form-control" />
        </div>

        <div class="form-group">
          <label>Rol</label>
          <select [(ngModel)]="nuevoUsuario.rol" class="form-control">
            <option value="EMPLEADO">Empleado</option>
            <option value="ADMIN">Administrador</option>
          </select>
        </div>
      </div>

      <div class="modal-buttons">
        <button class="btn-secondary" (click)="cancelarFormulario()">Cancelar</button>
        <button class="btn-success" (click)="guardarUsuario()">Guardar</button>
      </div>
    </div>
  </div>

  <!-- Tabla de usuarios -->
  <div class="table-container">
    <div *ngIf="loading" class="loading">Cargando usuarios...</div>
    
    <table class="table" *ngIf="!loading">
      <thead>
        <tr>
          <th>ID</th>
          <th>Nombre</th>
          <th>Email</th>
          <th>Rol</th>
          <th>Estado</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let user of usuarios">
          <td>{{ user.id }}</td>
          <td>{{ user.nombre }}</td>
          <td>{{ user.email }}</td>
          <td>
            <span class="badge" [ngClass]="user.rol === 'ADMIN' ? 'badge-admin' : 'badge-empleado'">
              {{ user.rol }}
            </span>
          </td>
          <td>
            <span class="badge" [ngClass]="user.activo ? 'badge-activo' : 'badge-inactivo'">
              {{ user.activo ? 'Activo' : 'Inactivo' }}
            </span>
          </td>
          <td class="actions">
            <button class="btn-icon btn-edit" (click)="editarUsuario(user)" title="Editar">✏️</button>
            <button class="btn-icon" [ngClass]="user.activo ? 'btn-deactivate' : 'btn-activate'" 
                    (click)="toggleUsuario(user)" 
                    [title]="user.activo ? 'Desactivar' : 'Activar'">
              {{ user.activo ? '🟢' : '🔴' }}
            </button>
          </td>
        </tr>
        <tr *ngIf="usuarios.length === 0">
          <td colspan="6" class="text-center">No hay usuarios registrados</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
