<aside [class]="collapsed ? 'w-16' : 'w-64'"
       class="fixed left-0 top-0 h-full z-40 bg-[#0b2b5e] shadow-2xl flex flex-col transition-all duration-300 pt-20">

  <!-- Icono centrado cuando está colapsado -->
  <div class="px-3 py-8 flex justify-center" *ngIf="collapsed">
    <span class="material-symbols-outlined text-white text-3xl">pedal_bike</span>
  </div>

  <!-- Nav Items -->
  <nav class="flex-1 px-3 space-y-1">
    <a *ngFor="let item of itemsVisibles"
       [routerLink]="item.route"
       routerLinkActive="bg-white/20 text-white scale-[0.98]"
       [class.justify-center]="collapsed"
       class="flex items-center gap-3 px-4 py-3 text-slate-300 hover:text-white hover:bg-white/10 transition-all duration-150 rounded-lg"
       [ngClass]="{'justify-center': collapsed, 'px-4': !collapsed}">
      <span class="material-symbols-outlined text-xl">{{ item.icon }}</span>
      <span *ngIf="!collapsed" class="text-[0.75rem] font-medium tracking-wider uppercase">
        {{ item.label }}
      </span>
    </a>
  </nav>

  <!-- Collapse Button -->
  <div class="px-3 border-t border-white/20 pt-4 pb-6">
    <button (click)="toggleCollapse()"
            [class.justify-center]="collapsed"
            class="flex items-center gap-3 px-4 py-3 text-slate-300 hover:text-white transition-all w-full rounded-lg hover:bg-white/10"
            [ngClass]="{'justify-center': collapsed, 'px-4': !collapsed}">
      <span class="material-symbols-outlined">
        {{ collapsed ? 'menu' : 'menu_open' }}
      </span>
      <span *ngIf="!collapsed" class="text-[0.75rem] font-medium tracking-wider uppercase">
        Colapsar
      </span>
    </button>
  </div>
</aside>
