<aside [class]="collapsed ? 'w-16' : 'w-64'"
       class="fixed left-0 top-0 h-full z-40 bg-primary-container shadow-2xl flex flex-col transition-all duration-300 pt-6">

  <!-- Logo -->
  <div class="px-6 py-8" *ngIf="!collapsed">
    <h1 class="text-lg font-bold text-white tracking-tight flex items-center gap-2">
      <span class="material-symbols-outlined text-secondary">pedal_bike</span>
      Bike Shop
    </h1>
    <p class="text-[0.65rem] text-slate-400 uppercase tracking-widest font-medium mt-1">
      Sistema de Gestión
    </p>
  </div>

  <div class="px-3 py-8" *ngIf="collapsed">
    <span class="material-symbols-outlined text-secondary text-2xl">pedal_bike</span>
  </div>

  <!-- Nav Items -->
  <nav class="flex-1 px-3 space-y-1">
    <a *ngFor="let item of itemsVisibles"
       [routerLink]="item.route"
       routerLinkActive="bg-white/10 text-white scale-[0.98]"
       class="flex items-center gap-3 px-4 py-3 text-slate-300 hover:text-white hover:bg-white/5 transition-all duration-150 rounded-lg">
      <span class="material-symbols-outlined">{{ item.icon }}</span>
      <span *ngIf="!collapsed" class="text-[0.75rem] font-medium tracking-wider uppercase">
        {{ item.label }}
      </span>
    </a>
  </nav>

  <!-- Collapse Button -->
  <div class="px-3 border-t border-white/10 pt-4 pb-6">
    <button (click)="toggleCollapse()"
            class="flex items-center gap-3 px-4 py-3 text-slate-400 hover:text-white transition-all w-full">
      <span class="material-symbols-outlined">
        {{ collapsed ? 'menu' : 'menu_open' }}
      </span>
      <span *ngIf="!collapsed" class="text-[0.75rem] font-medium tracking-wider uppercase">
        Collapse
      </span>
    </button>
  </div>
</aside>
