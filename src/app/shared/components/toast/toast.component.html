<div
  class="fixed bottom-4 right-4 z-[9999] flex items-start gap-3 w-80 rounded-xl shadow-lg px-4 py-4 transition-all duration-150 overflow-hidden"
  [ngClass]="[config.classes, visible ? 'opacity-100 translate-x-0' : 'opacity-0 translate-x-8']"
  role="alert"
>
  <!-- Icono -->
  <span
    class="material-symbols-outlined text-xl mt-0.5 flex-shrink-0"
    [ngClass]="iconColor"
  >
    {{ config.icon }}
  </span>

  <!-- Mensaje -->
  <p class="text-sm font-medium flex-1 leading-snug">{{ toast.message }}</p>

  <!-- Botón cerrar -->
  <button
    (click)="close()"
    class="text-slate-400 hover:text-slate-600 transition-colors flex-shrink-0 -mt-0.5"
    aria-label="Cerrar notificación"
  >
    <span class="material-symbols-outlined text-lg">close</span>
  </button>

  <!-- Barra de progreso animada -->
  <div class="absolute bottom-0 left-0 h-[3px] w-full bg-slate-100">
    <div
      class="h-full progress-bar"
      [ngClass]="config.bar"
      [style.animation-duration]="(toast.duration ?? 2000) + 'ms'"
    ></div>
  </div>
</div>
